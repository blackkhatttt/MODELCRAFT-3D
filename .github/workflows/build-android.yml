name: Build MODELCRAFT 3D Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Extract source archive
        run: |
          unzip MODELCRAFT_3D_v0.5.0_GitHub_Actions.zip -d source
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/source/MODELCRAFT_3D_v0.5.0" >> "$GITHUB_ENV"
      - name: Install and configure Capacitor
        run: |
          cd "$PROJECT_DIR"
          npm install
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MODELCRAFT-3D-v0.5.0-debug-apk
          path: source/MODELCRAFT_3D_v0.5.0/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
